<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14120f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Gloock&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    <meta name="description" content="Swipe right for YES, left for NO. Stake NEAR on contested claims that an attested AI arbiter settles." />
    <title>Hunch | Swipe a claim, stake NEAR</title>
  </head>
  <body data-page="deck">
    <div id="app" aria-busy="true">
      <header class="topbar">
        <a class="wordmark" href="/" aria-label="Hunch home">Hunch<span class="mark">.</span></a>
        <div class="bar-end">
          <a class="network" href="https://testnet.nearblocks.io" target="_blank" rel="noopener"><span class="live-dot" aria-hidden="true"></span>NEAR testnet</a>
          <button id="wallet-button" class="wallet-button" type="button" hidden>Connect wallet</button>
        </div>
      </header>
      <main class="table">
        <p class="pitch">Swipe a claim. Stake NEAR. An attested AI arbiter settles it.</p>
        <div id="stack" class="stack is-loading" aria-live="polite"><div class="card-ghost" aria-hidden="true"></div><p class="dealing">Dealing the stack from NEAR testnet</p></div>
        <div id="actions" class="actions" role="group" aria-label="Swipe controls" hidden>
          <button type="button" class="act act-no" data-act="no" aria-label="NO, swipe left"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg><span>No</span></button>
          <button type="button" class="act act-skip" data-act="skip" aria-label="Skip this claim"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Skip</span></button>
          <button type="button" class="act act-details" data-act="details" aria-label="Details and evidence"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 5h14v14H5zM8.5 9.5h7M8.5 13h7M8.5 16.5h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Details</span></button>
          <button type="button" class="act act-yes" data-act="yes" aria-label="YES, swipe right"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Yes</span></button>
        </div>
        <p class="keys" aria-hidden="true"><kbd>←</kbd> No <kbd>↑</kbd> Skip <kbd>→</kbd> Yes <kbd>Enter</kbd> Details<span id="count" class="count"></span></p>
      </main>
      <div id="sheet" class="sheet" hidden></div>
      <div id="detail" class="detail" hidden role="dialog" aria-modal="true" aria-labelledby="detail-title">
        <div class="detail-bar"><button type="button" class="back" data-close><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Back to the stack</button></div>
        <div id="detail-body" class="detail-body"></div>
      </div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
