<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14120f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Gloock&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    <meta name="description" content="A claim with live NEAR odds, a stake history chart, sources and an attested resolution." />
    <title>Hunch | Claim</title>
  </head>
  <body data-page="fact">
    <div id="app" aria-busy="true">
      <header class="topbar">
        <a class="wordmark" href="/" aria-label="Hunch home">Hunch<span class="mark">.</span></a>
        <div class="bar-end">
          <a class="network" href="https://testnet.nearblocks.io" target="_blank" rel="noopener"><span class="live-dot" aria-hidden="true"></span>NEAR testnet</a>
          <button id="wallet-button" class="wallet-button" type="button" hidden>Connect wallet</button>
        </div>
      </header>
      <div class="detail detail-page">
        <div class="detail-bar"><a class="back" id="back-link" href="/"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Back to the stack</a></div>
        <div id="fact-view" class="detail-body"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
